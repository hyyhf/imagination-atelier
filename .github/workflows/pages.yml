name: Verify and deploy the 30-work atelier

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atelier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Verify all 30 artifacts and source files
        run: python3 scripts/check_source.py
      - name: Test publisher safety and configuration branches
        run: python3 -m unittest discover -s qa -p 'test_*.py' -v
      - name: Verify spatial routes, paper, analysis, scheduling and text-data workflows
        run: npm run test:works
      - name: Install locked dependencies
        run: npm ci
      - name: Build complete React / HeroUI site
        run: npm run build
      - name: Install browser testing tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r qa/requirements.txt
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Verify gallery interactions and 30 artifact startups
        run: .venv/bin/python qa/browser_smoke.py --site dist --artifacts
      - name: Upload deployable Pages output
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Check out verifier (no stored credential)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify actual online revision, assets and every artifact
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 scripts/check_live.py --url "$PAGES_URL" --sha "$EXPECTED_SHA" --attempts 8

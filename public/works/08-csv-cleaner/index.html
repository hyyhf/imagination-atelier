<header><div class="identity"><span class="number">08</span><div><h1>CSV 表格批量清洗工具</h1><p>原值可追踪，处理可复用，异常有去向。</p></div></div><div class="actions"><button id="undo" aria-label="撤销" disabled>撤销</button><button id="redo" aria-label="重做" disabled>重做</button><button id="loadPlan">打开方案</button><button id="savePlan">保存方案</button><button id="nextBatch">下一批，保留规则</button><button class="primary" id="export">导出结果 CSV</button></div></header>
<section class="intro"><div><input id="title" aria-label="清洗任务名称" value="客户登记表 · 示例"><p>导入表格 → 编排规则 → 更正异常 → 导出。规则可用于下一批。</p></div><div class="metrics"><div class="metric"><strong id="total">0</strong><span>原始记录</span></div><div class="metric"><strong id="valid">0</strong><span>通过校验</span></div><div class="metric"><strong id="issues">0</strong><span>待复核</span></div><div class="metric"><strong id="excluded">0</strong><span>已隔离</span></div></div></section>
<main class="workspace"><aside class="sidebar"><div class="section-title"><h2>输入与清洗规则</h2><button id="import" class="small primary">导入 / 粘贴</button></div><div id="sources"></div><div class="actions"><button class="small" id="reference">导入参照表</button><button class="small" id="removeReference">移除参照表</button></div><div id="referenceInfo" class="muted" style="font-size:11px;margin-top:6px"></div><div class="divider"></div><div class="section-title"><h3>按顺序处理</h3><button id="addRule" class="small">＋ 规则</button></div><div id="rules"></div><div class="divider"></div><div class="actions"><button class="small" id="saveRules">保存规则</button><button class="small" id="loadRules">载入规则</button></div><p class="note">规则只处理指定字段。日期按选定格式，金额按十进制舍入；原始记录始终保留。</p></aside>
<section class="canvas" aria-label="原始记录与清洗结果"><div class="toolbar"><select id="view" aria-label="查看记录"><option value="result">清洗结果</option><option value="issues">待复核记录</option><option value="excluded">已隔离记录</option><option value="source">原始记录</option></select><input id="search" type="search" aria-label="搜索记录" placeholder="搜索任何字段…" class="grow"><button class="small" id="copy">复制结果 TSV</button></div><div id="runError" class="error hidden" role="alert"></div><div class="tablewrap"><table id="grid"></table></div><div class="pager"><span id="pageInfo"></span><div class="actions"><button id="prev" class="small">上一页</button><button id="next" class="small">下一页</button></div></div></section>
<aside class="inspector"><div id="inspector"></div><div class="divider"></div><h3>输出范围</h3><label class="check"><input id="onlyValid" type="checkbox" checked>仅导出通过校验的记录</label><label class="check"><input id="excel" type="checkbox" checked>Excel 公式保护</label><div class="stack"><button id="exportIssues">导出问题与隔离清单</button><button id="exportReport">导出处理报告</button></div><p id="exportInfo" class="note"></p></aside></main>
<footer><span id="status" role="status">试试点开标橙的记录，修正原值后规则会重新计算。</span><span>数据只在本地处理 · <button id="restore" class="small">恢复暂存</button></span></footer>
<dialog id="importDialog"><div class="dialog-head"><h2>带入你的表格</h2><button data-close="importDialog" aria-label="关闭表格导入">关闭</button></div><div class="dialog-body"><div class="actions"><button id="chooseData">选择 CSV / TSV 文件</button><select id="encoding" aria-label="文件编码"><option value="utf-8">UTF-8</option><option value="gb18030">GB18030 / GBK</option><option value="utf-16le">UTF-16 LE</option></select></div><p class="muted" style="font-size:12px;margin:10px 0">可多选合并；不自动猜测数值类型，编号中的前导零不会消失。Excel 工作簿请另存为 CSV。</p><label class="field">粘贴含列名的表格<textarea id="paste" aria-label="粘贴含列名的表格" rows="8" placeholder="从 Excel 复制整块表格，或粘贴 CSV…"></textarea></label><div class="pair"><label class="field">分隔符<select id="delimiter" aria-label="分隔符"><option value="">自动</option><option value=",">逗号</option><option value="tab">制表符</option><option value=";">分号</option></select></label><label class="field">如何带入<select id="importMode" aria-label="导入方式"><option value="replace">替换数据，保留并匹配规则</option><option value="append">追加到现有数据</option><option value="fresh">替换数据，清空规则</option></select></label></div><p class="note">保留规则时，缺少所需字段的步骤会暂时停用并列明；不会猜测映射或覆盖原字段。非法格式会整体拒绝。</p><p id="importStatus" role="status"></p></div><div class="dialog-foot"><button data-close="importDialog">取消</button><button id="applyPaste" class="primary">应用粘贴表格</button></div></dialog>
<input type="file" id="dataFile" accept=".csv,.tsv,.txt" multiple hidden><input type="file" id="refFile" accept=".csv,.tsv,.txt" hidden><input type="file" id="planFile" accept=".json" hidden><input type="file" id="rulesFile" accept=".json" hidden>

 const extra={case:()=>field('转换方向','mode',sel('mode',[['lower','小写'],['upper','大写'],['title','单词首字母大写']],r.mode||'lower')),replace:()=>field('查找原文','from',inp('from',r.from))+field('替换为','to',inp('to',r.to)),digits:()=>'<label class="check"><input name="chinaPhone" type="checkbox" '+(r.chinaPhone?'checked':'')+'>中国手机：13 位且以 86 开头时去掉国码</label>',number:()=>field('保留小数位 · 十进制四舍五入','decimals',inp('decimals',r.decimals??2,'number')),date:()=>field('原始日期格式','pattern',sel('pattern',[['YYYY/MM/DD','YYYY/MM/DD'],['YYYY-MM-DD','YYYY-MM-DD'],['DD/MM/YYYY','DD/MM/YYYY'],['YYYY年MM月DD日','YYYY年MM月DD日']],r.pattern||'YYYY-MM-DD')),split:()=>field('分隔符（原文）','separator',inp('separator',r.separator??' '))+field('取第几段（从 1 开始）','index',inp('index',Number(r.index||0)+1,'number'))+field('生成新列名','target',inp('target',r.target)),combine:()=>field('连接符','separator',inp('separator',r.separator??' '))+field('生成新列名','target',inp('target',r.target)),dedupe:()=>field('重复键处理','policy',sel('policy',[['first','保留第一条'],['last','保留最后一条'],['merge','保留首条，空值用后续补充']],r.policy||'first'))+'<p class="note">键为空的行不互相合并。被去重的记录进入隔离清单，合并保留全部来源标识。</p>',filter:()=>field('仅保留符合条件的记录','op',sel('op',[['not_empty','非空'],['empty','为空'],['eq','等于'],['contains','包含'],['gte','数值 ≥'],['lte','数值 ≤']],r.op||'not_empty'))+field('比较值','value',inp('value',r.value)),validate:()=>field('校验类型','check',sel('check',[['required','必填'],['email','邮箱格式'],['number','十进制数值'],['length','精确字符长度'],['date','有效 YYYY-MM-DD 日期']],r.check||'required'))+field('长度校验值','value',inp('value',r.value||'')),lookup:()=>field('参照表匹配键','refKey','<select name="refKey">'+options(state.reference?.columns||[],r.refKey)+'</select>')+field('取参照表哪一列','refValue','<select name="refValue">'+options(state.reference?.columns||[],r.refValue)+'</select>')+field('生成新列名','target',inp('target',r.target))+field('重复参照键','policy',sel('policy',[['error','提示错误，先修正参照表'],['first','明确取第一条'],['last','明确取最后一条']],r.policy||'error'))};controls+=(extra[r.kind]?.()||'');
 $('inspector').innerHTML=`<div class="section-title"><h2>${draft?'添加清洗规则':'编辑清洗规则'}</h2><span class="badge">${esc(M.kinds[r.kind])}</span></div><form id="ruleForm">${controls}<div class="actions"><button class="primary" type="submit">应用规则</button>${draft?'<button type="button" id="cancelRule">取消</button>':''}</div></form>`;
 $('rule-kind').onchange=e=>{draft=defaults(e.target.value,r.id);ruleEditor();};$('ruleForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),n={id:r.id,kind:f.get('kind'),enabled:r.enabled??true};for(const [k,v] of f)if(k!=='kind'&&k!=='keys')n[k]=v;if(['dedupe','combine'].includes(n.kind))n.keys=f.getAll('keys');if(n.kind==='digits')n.chinaPhone=f.has('chinaPhone');if(n.kind==='number')n.decimals=Number(n.decimals);if(n.kind==='split')n.index=Number(n.index)-1;const rules=state.rules.some(x=>x.id===n.id)?state.rules.map(x=>x.id===n.id?n:x):[...state.rules,n];if(commit({...state,rules},'规则已应用，结果和问题清单已重算。')){selectedRule=n.id;draft=null;selectedRow=null;render();}};if($('cancelRule'))$('cancelRule').onclick=()=>{draft=null;ruleEditor();};

function defaults(kind='trim',id='rule-'+Date.now()){const col=allColumns()[0]||'',target=col+'_新列';return {id,kind,enabled:true,column:kind==='trim'?'*':col,mode:'lower',from:'旧值',to:'新值',decimals:2,pattern:'YYYY-MM-DD',separator:' ',index:0,target,keys:[col],policy:kind==='lookup'?'error':'first',op:'not_empty',check:'required',value:'',refKey:state.reference?.columns[0]||'',refValue:state.reference?.columns[1]||state.reference?.columns[0]||''};}
function rowEditor(){const r=derive(),source=state.sources.flatMap(a=>a.rows).find(x=>x.id===selectedRow);if(!source){selectedRow=null;ruleEditor();return;}const processed=[...r.rows,...r.excluded].find(x=>x.id===selectedRow);$('inspector').innerHTML=`<div class="section-title"><h2>原记录 #${source.record}</h2><button id="backRules" class="small">规则</button></div><p class="muted" style="font-size:12px">${esc(source.source)}</p>${processed?.issues?.length?'<p class="note">'+processed.issues.map(x=>esc(x.column+'：'+x.message)).join('<br>')+'</p>':''}<form id="correctionForm">${Object.keys(source.raw).map(k=>`<div class="row-value"><label>${esc(k)}<small>原值：${esc(source.raw[k])||'空'}<br>处理后：${esc(processed?.values[k]??'')}</small><input name="${esc(k)}" value="${esc(state.overrides[source.id]?.[k]??source.raw[k])}" aria-label="修正 ${esc(k)}"></label></div>`).join('')}<div class="actions" style="margin-top:12px"><button type="submit" class="primary">修正原值并重跑</button><button type="button" id="resetRow">恢复原值</button></div></form><div class="actions" style="margin-top:12px"><button id="isolateRow">${state.isolated.includes(source.id)?'取消手动隔离':'手动隔离此行'}</button></div><p class="note">修正保存在独立记录中；原始值不被覆盖。规则、导出与问题清单会重新计算。</p>`;
 $('backRules').onclick=()=>{selectedRow=null;ruleEditor();};$('correctionForm').onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(new FormData(e.target));commit({...state,overrides:{...state.overrides,[source.id]:values}},'更正已应用；原始值仍可追踪。');};$('resetRow').onclick=()=>{const overrides={...state.overrides};delete overrides[source.id];commit({...state,overrides},'已恢复此行原值。');};$('isolateRow').onclick=()=>commit({...state,isolated:state.isolated.includes(source.id)?state.isolated.filter(x=>x!==source.id):[...state.isolated,source.id]},'手动隔离状态已更新。');
}
function render(){const r=derive();$('title').value=state.title;$('undo').disabled=!past.length;$('redo').disabled=!future.length;$('total').textContent=r?.total??state.sources.reduce((n,s)=>n+s.rows.length,0);$('valid').textContent=r?.valid.length??'—';$('issues').textContent=r?r.rows.length-r.valid.length:'—';$('excluded').textContent=r?.excluded.length??'—';$('sources').innerHTML=state.sources.map(a=>`<div class="source">${esc(a.name)}<small>${a.rows.length} 行 · ${a.columns.length} 列</small></div>`).join('')||'<p class="note">新批次已准备好，带入数据后沿用当前规则。</p>';$('referenceInfo').textContent=state.reference?state.reference.name+' · '+state.reference.rows.length+' 行':'未载入参照表';$('removeReference').disabled=!state.reference;$('runError').classList.toggle('hidden',!error);$('runError').textContent=error;$('onlyValid').checked=state.prefs.onlyValid;$('excel').checked=state.prefs.excel;for(const id of ['export','exportIssues','exportReport','copy','savePlan'])$(id).disabled=!r;const count=r?output().length:0;$('exportInfo').textContent=count+' 条将进入结果文件。搜索和当前视图不会改变导出范围；隔离与待复核内容可单独带走。';renderRules();table();selectedRow?rowEditor():ruleEditor();}
function move(id,delta){const i=state.rules.findIndex(r=>r.id===id),j=i+delta;if(i<0||j<0||j>=state.rules.length)return;const rules=[...state.rules];[rules[i],rules[j]]=[rules[j],rules[i]];commit({...state,rules},'规则顺序已更新。');}
document.addEventListener('click',e=>{const t=e.target.closest('[data-close],[data-select-rule],[data-move-rule],[data-delete-rule],[data-row]');if(!t)return;if(t.dataset.close)$(t.dataset.close).close();if(t.dataset.selectRule){selectedRule=t.dataset.selectRule;selectedRow=null;draft=null;render();}if(t.dataset.moveRule)move(t.dataset.moveRule,Number(t.dataset.delta));if(t.dataset.deleteRule){commit({...state,rules:state.rules.filter(x=>x.id!==t.dataset.deleteRule)},'规则已删除，可以撤销。');}if(t.dataset.row){selectedRow=t.dataset.row;draft=null;render();}});
document.addEventListener('change',e=>{const id=e.target.dataset.toggleRule;if(id)commit({...state,rules:state.rules.map(r=>r.id===id?{...r,enabled:e.target.checked}:r)},'规则启用状态已更新。');});let drag=null;$('rules').ondragstart=e=>{drag=e.target.closest('[data-rule]')?.dataset.rule;e.dataTransfer?.setData('text/plain',drag||'');};$('rules').ondragover=e=>e.preventDefault();$('rules').ondrop=e=>{e.preventDefault();const target=e.target.closest('[data-rule]')?.dataset.rule;if(!target||!drag||drag===target)return;const rules=[...state.rules],from=rules.findIndex(x=>x.id===drag),to=rules.findIndex(x=>x.id===target);if(from<0||to<0)return;rules.splice(to,0,rules.splice(from,1)[0]);commit({...state,rules},'规则顺序已更新。');drag=null;};
 $('undo').onclick=()=>{if(!past.length)return;future.push(state);state=past.pop();revision++;draft=null;render();message('已撤销。');};$('redo').onclick=()=>{if(!future.length)return;past.push(state);state=future.pop();revision++;draft=null;render();message('已重做。');};$('title').onchange=e=>commit({...state,title:e.target.value},'任务名称已更新。');$('addRule').onclick=()=>{draft=defaults();selectedRow=null;ruleEditor();};$('view').onchange=()=>{page=0;table();};$('search').oninput=()=>{page=0;table();};$('prev').onclick=()=>{page--;table();};$('next').onclick=()=>{page++;table();};for(const [id,key] of [['onlyValid','onlyValid'],['excel','excel']])$(id).onchange=e=>commit({...state,prefs:{...state.prefs,[key]:e.target.checked}},'导出设置已更新。');
 $('import').onclick=()=>{$('importStatus').textContent='';$('importDialog').showModal();};$('chooseData').onclick=()=>$('dataFile').click();$('applyPaste').onclick=()=>{try{const source=M.parse($('paste').value,'粘贴表格','data-'+Date.now(),$('delimiter').value==='tab'?'\t':$('delimiter').value);applySources([source]);}catch(e){$('importStatus').textContent=e.message;}};
 async function readData(files,ref=false){const start=revision,ticket=++io;message('正在读取本地表格…');try{const sources=await Promise.all([...files].map(async(f,i)=>{if(/\.xlsx?$/i.test(f.name))throw Error('Excel 工作簿请另存为 CSV。');const text=new TextDecoder($('encoding').value,{fatal:true}).decode(await f.arrayBuffer());return M.parse(text,f.name,(ref?'ref-':'data-')+Date.now()+'-'+i,$('delimiter').value==='tab'?'\t':$('delimiter').value);}));if(ticket!==io||revision!==start){message('任务已改变，旧的读取结果未覆盖当前任务。');return;}if(ref){commit({...state,reference:sources[0]},'参照表已载入。');}else applySources(sources);}catch(e){message('未修改现有数据：'+e.message);$('importStatus').textContent=e.message;}}

<header><div class="identity"><span class="number">09</span><div><h1>文本差异对比与逐条审校</h1><p>对照原文，逐条决定，留下可追溯的合稿。</p></div></div><div class="actions"><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button><button id="load">打开方案</button><button id="save">保存方案</button><button id="nextRevision">用合稿开始下一版</button><button id="export" class="primary">导出确认合稿</button></div></header>
<section class="intro"><div><input id="title" aria-label="审校任务名称"><p id="names"></p></div><div class="metrics"><div class="metric"><strong id="total">0</strong><span>变更</span></div><div class="metric"><strong id="pending">0</strong><span>待审</span></div><div class="metric"><strong id="accepted">0</strong><span>接受</span></div><div class="metric"><strong id="kept">0</strong><span>保留 / 自定义</span></div></div></section>
<main class="workspace"><aside class="sidebar"><button class="primary" id="input">导入 / 粘贴两份文稿</button><div class="divider"></div><h2>变更导航</h2><p class="note">蓝色是修订增加，红色是原稿删除。未决定的变更在预览中保留原文。</p><div id="nav" class="change-nav"></div><div class="divider"></div><div class="stack"><button id="acceptPending">接受所有待审</button><button id="keepPending">保留所有待审原文</button><button id="resetDecisions">重置全部决定</button></div></aside>
<section class="canvas" aria-label="文稿对比工作区"><div class="toolbar"><select id="view" aria-label="审校视图"><option value="changes">逐条对照</option><option value="merged">合稿预览</option></select><select id="filter" aria-label="变更状态"><option value="all">全部变更</option><option value="pending">待审</option><option value="accept">已接受</option><option value="keep">保留原文</option><option value="custom">自定义</option></select><input id="search" type="search" class="grow" aria-label="搜索变更" placeholder="搜索原文、修订、备注…"></div><div id="review" class="review-list"></div></section>
<aside class="inspector"><div id="inspector"></div><div class="divider"></div><h3>显示与输出</h3><label class="field">相同段落显示<select id="context" aria-label="相同段落上下文"><option value="0">隐藏</option><option value="2">上下各 2 行</option><option value="5">上下各 5 行</option><option value="9999">完整原文</option></select></label><label class="field">合稿换行<select id="eol" aria-label="合稿换行"><option value="source">跟随原稿</option><option value="lf">LF</option><option value="crlf">CRLF</option></select></label><div class="stack"><button id="copy">复制合稿预览</button><button id="report">导出审校报告</button><button id="restore">恢复暂存</button></div><p class="note">支持 TXT / Markdown 纯文本。差异与决定由你复核，不自动作法律、专业或事实判断。</p></aside></main>
<footer><span id="status" role="status">先打开一项变更，接受修订、保留原文，或写自己的合稿。</span><span>文字仅在本地处理</span></footer>
<dialog id="inputDialog"><div class="dialog-head"><h2>带入两份文稿</h2><button data-close="inputDialog">关闭</button></div><div class="dialog-body"><div class="actions"><label class="field">文件编码<select id="encoding"><option value="utf-8">UTF-8</option><option value="gb18030">GB18030 / GBK</option><option value="utf-16le">UTF-16 LE</option></select></label><p class="muted">支持粘贴或 TXT / MD 文件；新比较会清空旧决定，原任务可撤销。</p></div><div class="pair input-pair"><div><label class="field">原稿名称<input id="leftName" aria-label="原稿名称"></label><button id="chooseLeft">选择原稿文件</button><label class="field">原稿<textarea id="left" aria-label="原稿文字" rows="14"></textarea></label></div><div><label class="field">修订稿名称<input id="rightName" aria-label="修订稿名称"></label><button id="chooseRight">选择修订稿文件</button><label class="field">修订稿<textarea id="right" aria-label="修订稿文字" rows="14"></textarea></label></div></div><p id="inputStatus" role="status"></p></div><div class="dialog-foot"><button data-close="inputDialog">取消</button><button id="compare" class="primary">建立对比</button></div></dialog>
<input id="leftFile" type="file" accept=".txt,.md,.csv,.json" hidden><input id="rightFile" type="file" accept=".txt,.md,.csv,.json" hidden><input id="planFile" type="file" accept=".json" hidden><dialog id="copyDialog"><div class="dialog-head"><h2>复制合稿预览</h2><button data-close="copyDialog">关闭</button></div><div class="dialog-body"><p>按 Ctrl/Cmd+C 复制。待审项目保留原文。</p><textarea id="copyText" rows="14" readonly></textarea></div></dialog>

一、交付安排
首稿在 3 个工作日内提交。
修改轮次最多 3 次。
新增需求另行确认范围。

二、文件要求
交付 PDF、PNG 和可编辑源文件。
图片分辨率不低于 300 dpi。

每周二和周五通过邮件发送进度。
